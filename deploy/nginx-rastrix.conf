# Configuración de Nginx para Rastrix (rastrix.deveps.dev).
#
# El dominio sirve dos cosas:
#   - /admin/  el panel de administración (Angular, ficheros estáticos en
#              /var/www/rastrix-admin, los instala deploy.sh).
#   - todo lo demás se reenvía al backend en el puerto 8086.
# Al compartir dominio, el panel llama a /api sin necesidad de CORS.
# /swagger-ui y /v3/api-docs quedan deshabilitados en producción desde la
# propia aplicación (application-prod.properties).
#
# Si el servidor ya estaba configurado (Certbot habrá añadido el bloque 443),
# no sustituyas el fichero: copia solo los dos bloques "location" del panel
# dentro del server que escucha en 443 y recarga Nginx.
#
# --- Puesta en marcha (primera vez) ---------------------------------------
# 1. Apunta un registro DNS de "rastrix" (tipo A o CNAME) a la IP de este
#    servidor, igual que ya tienes hecho para deveps.dev y pedidai.es.
# 2. Copia este fichero:
#      sudo cp deploy/nginx-rastrix.conf /etc/nginx/sites-available/rastrix.deveps.dev
#      sudo ln -s /etc/nginx/sites-available/rastrix.deveps.dev /etc/nginx/sites-enabled/
# 3. Comprueba y recarga Nginx:
#      sudo nginx -t && sudo systemctl reload nginx
# 4. Pide el certificado (Certbot detecta este server_name y añade él solo
#    el bloque 443 + la redirección 80->443, igual que hizo con tus otros
#    dominios):
#      sudo certbot --nginx -d rastrix.deveps.dev
# 5. Despliega Rastrix con deploy/deploy.sh indicando el puerto 8086 cuando
#    te lo pida.
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name rastrix.deveps.dev;

    # Panel de administración.
    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        alias /var/www/rastrix-admin/;
        # Rutas internas del panel (/admin/mercados/15) caen en index.html y las
        # resuelve el router de Angular.
        try_files $uri $uri/ /admin/index.html;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        proxy_pass http://localhost:8086;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 11M;
    }
}
