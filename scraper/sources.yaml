# Páginas que el scraper revisa en cada pasada.
#
# Cada fuente es una página donde se anuncian mercados de antigüedades,
# almonedas, rastros o ferias de coleccionismo.
#
# Campos:
#   nombre     Nombre corto para los logs.
#   url        Página a descargar.
#   provincia  Opcional. Se usa si la página no indica la provincia.
#   ciudad     Opcional. Se usa si la página no indica la ciudad.
#
# Si una página no cambia de una pasada a otra, no se vuelve a analizar.
#
# Todas se comprobaron el 2026-09-13: responden, robots.txt permite leerlas y
# su texto habla de antigüedades. Se descartaron por robots.txt la agenda propia
# del Mercat Gòtic y El Troc; por cargar el contenido con JavaScript (el scraper
# no ejecuta JavaScript) las páginas de Pontevedra y El Vendrell.

