springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# El servidor va detrás de un proxy inverso (Nginx/Let's Encrypt) que termina el
# TLS y reenvía a esta app. Sin esto, request.getRemoteAddr() devolvería siempre
# la IP del proxy (127.0.0.1) en vez de la del cliente real, y el rate limiting
# por IP del login dejaría de servir para nada. Requiere que el proxy envíe la
# cabecera X-Forwarded-For (Nginx lo hace por defecto con proxy_set_header).
server.forward-headers-strategy=framework
