spring.application.name=rastrix
server.port=${SERVER_PORT:8080}
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:rastrix}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=false

security.jwt.secret=${JWT_SECRET:ubxiSWZ6Fn73bF2oWJ6T835dSNW4pTYqCmV/5hPMHrw=}
# Token de acceso: vida corta (30 min) porque ahora hay refresh token para
# renovarlo sin volver a pedir credenciales.
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:1800000}
# Refresh token: vida larga (30 días). Se guarda hasheado en BD y rota en
# cada uso (ver RefreshTokenService).
security.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:2592000000}

app.admin.name=${ADMIN_NAME:}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

security.rate-limit.login.max-attempts-per-email=${LOGIN_MAX_ATTEMPTS_PER_EMAIL:5}
security.rate-limit.login.max-attempts-per-ip=${LOGIN_MAX_ATTEMPTS_PER_IP:20}
security.rate-limit.login.window-minutes=${LOGIN_RATE_LIMIT_WINDOW_MINUTES:15}

# Envío de correo (recuperación de contraseña) vía SMTP de Gmail con una
# contraseña de aplicación (no la contraseña normal de la cuenta). MAIL_PASSWORD
# no tiene valor por defecto a propósito: sin configurarla, la app arranca
# igualmente, solo falla si se intenta usar /api/auth/forgot-password.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:devepsdev@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.default-encoding=UTF-8

security.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:15}
